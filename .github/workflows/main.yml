name: Extract and Push Telegram Saver Bot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract ZIP
        run: |
          rm -rf extracted
          mkdir -p extracted

          unzip -o telegram-saver-bot.zip -d extracted

          echo "=== ZIP CONTENTS ==="
          find extracted -maxdepth 3 -type f | sort

      - name: Copy project files to repository root
        run: |
          if [ -d "extracted/telegram-saver-bot" ]; then
            echo "Found telegram-saver-bot folder."
            cp -a extracted/telegram-saver-bot/. .
          else
            echo "No telegram-saver-bot folder found."
            echo "Copying ZIP contents directly to repository root."
            cp -a extracted/. .
          fi

      - name: Remove temporary files
        run: |
          rm -rf extracted
          rm -rf telegram-saver-bot

      - name: Show final repository
        run: |
          echo "=== FINAL FILES ==="
          find . -maxdepth 3 -type f \
            ! -path "./.git/*" | sort

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Extract and deploy Telegram Saver Bot"
          fi

      - name: Push changes
        run: |
          git push
